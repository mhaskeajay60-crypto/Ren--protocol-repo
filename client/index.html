      /*

      :root {

        Keep author data private and local. Interactions should behave like precise editorial tools:
        direct, calm, and available without ever leaving the manuscript context.

      (() => {
        'use strict';

        const STORAGE_KEY = 'the-ren-protocol.v1';

          const text = reviewedGeneratedText();
          if (!text) return toast('There is no reviewed section to merge.');
          const chapter = currentChapter(); const before = chapter.versions[data.selectedVersion] || '';
          const cursor = Math.max(0, Math.min(Number(data.cursorPosition || before.length), before.length));
          const join = before.trim() ? '\n\n' : '';
          const next = mode === 'replace' ? text : mode === 'insert' ? `${before.slice(0,cursor)}${before.slice(0,cursor).trim() ? '\n\n' : ''}${text}${before.slice(cursor).trim() ? '\n\n' : ''}${before.slice(cursor)}` : `${before}${join}${text}`;
          chapter.versions[data.selectedVersion] = next; chapter.updatedAt = now(); data.draft = next;
          trackDailyWords(before, next, data.selectedVersion);
          logEvent('Guided section merged', chapter.title, `${mode === 'replace' ? 'Replaced the' : mode === 'insert' ? 'Inserted into the' : 'Appended to the'} active draft after author review.`, chapter.id);
          composer().generated = ''; composer().sectionTitle = ''; composer().craftNote = '';
          data.activeView = 'chapter'; persist('Reviewed section merged into the local folio.'); render();
          setTimeout(() => { const editor = document.getElementById('chapter-editor'); if (editor) { editor.focus(); editor.selectionStart = editor.selectionEnd = mode === 'insert' ? Math.min(next.length, cursor + text.length + (cursor ? 2 : 0)) : next.length; } }, 20);
        }

        document.addEventListener('click', event => {
          const target = event.target.closest('[data-action]');
          if (!target) return;
          const { action, category, id, view, version, fingerprint, message } = target.dataset;
          if (action === 'close-modal-backdrop' && event.target === target) closeModal();
          else if (action === 'close-modal') closeModal();
          else if (action === 'set-view') { closeModal(); saveDraft(false); data.activeView = view; data.draft = currentChapter().versions[data.selectedVersion] || ''; persist('', true); render(); }
          else if (action === 'open-palette') openPalette();
          else if (action === 'open-settings') openSettings();
          else if (action === 'open-export') openExport();
          else if (action === 'organize-dump') organizeBrainDump();
          else if (action === 'generate-section') generateSection();
          else if (action === 'discard-generated') { composer().generated = ''; composer().sectionTitle = ''; composer().craftNote = ''; persist('Unmerged guided draft discarded.'); render(); }
          else if (action === 'copy-generated') { navigator.clipboard?.writeText(reviewedGeneratedText()); toast('Reviewed section copied to your clipboard.'); }
          else if (action === 'replace-with-generated') mergeGenerated('replace');
          else if (action === 'append-generated') mergeGenerated('append');
          else if (action === 'insert-generated') mergeGenerated('insert');
          else if (action === 'file-suggestions') fileBrainDumpSuggestions();
          else if (action === 'clear-inbox-suggestions') { inbox().suggestions = []; inbox().summary = ''; persist('Brain Dump proposals discarded.'); render(); }
          else if (action === 'select-all-suggestions') { document.querySelectorAll('[data-suggestion-index]').forEach(check => { check.checked = true; }); }
          else if (action === 'toggle-inspector') document.getElementById('app').classList.toggle('inspector-open');
          else if (action === 'toggle-focus') document.getElementById('app').classList.toggle('focus-mode');
          else if (action === 'toggle-bookmark') { const chapter = currentChapter(); data.bookmarks = data.bookmarks.includes(chapter.id) ? data.bookmarks.filter(item => item !== chapter.id) : [...data.bookmarks, chapter.id]; persist(data.bookmarks.includes(chapter.id) ? 'Folio bookmarked.' : 'Folio bookmark removed.'); render(); }
          else if (action === 'chapter-details') openChapterDetails();
          else if (action === 'new-chapter') { saveDraft(false); const chapter = newChapter(data.chapters.length + 1); data.chapters.push(chapter); data.activeChapterId = chapter.id; data.selectedVersion = 'main'; data.draft = ''; logEvent('Chapter created', chapter.title, 'A new chapter was opened in the Chapter Stream.', chapter.id); persist('New chapter created locally.'); render(); setTimeout(() => document.getElementById('chapter-title')?.focus(), 20); }
          else if (action === 'select-chapter') { closeModal(); saveDraft(false); data.activeChapterId = id; const chapter = currentChapter(); data.selectedVersion = chapter.activeVersion || 'main'; data.draft = chapter.versions[data.selectedVersion] || ''; data.activeView = 'chapter'; persist('', true); render(); }
          else if (action === 'switch-version') { saveDraft(false); const chapter = currentChapter(); chapter.activeVersion = version; data.selectedVersion = version; data.draft = chapter.versions[version] || ''; persist('', true); render(); }
          else if (action === 'save-draft') saveDraft(true);
          else if (action === 'open-scene-form') openSceneForm(id || null);
          else if (action === 'open-note-form') openNoteForm(id || null, target.dataset.kind || '');
          else if (action === 'open-issue-form') openIssueForm();
          else if (action === 'resolve-issue') { const issue = data.issues.find(item => item.id === id); if (issue) { issue.resolved = true; issue.resolvedAt = now(); logEvent('Revision issue resolved', issue.title, 'Issue closed in the revision ledger.', issue.chapterId); persist('Revision issue marked resolved.'); render(); } }
          else if (action === 'toggle-section') { data.collapsed = data.collapsed.includes(category) ? data.collapsed.filter(item => item !== category) : [...data.collapsed, category]; persist('', true); render(); }
          else if (action === 'open-entry-form') openEntryForm(category, id);
          else if (action === 'save-entry-form') saveEntryForm(category, id || null);
          else if (action === 'view-entry' || action === 'view-history') viewEntry(category, id);
          else if (action === 'edit-from-profile') { closeModal(); openEntryForm(category, id); }
          else if (action === 'delete-entry') { const entry = data.masterbook[category].find(item => item.id === id); if (entry && window.confirm(`Delete “${entry.name}” from the Masterbook? This cannot be undone unless you restore an exported archive.`)) { data.masterbook[category] = data.masterbook[category].filter(item => item.id !== id); logEvent('Masterbook deleted', `${entry.name} removed`, `${categories[category].singular} record deleted from the Masterbook.`); persist(`${entry.name} deleted.`); render(); } }
          else if (action === 'run-check') { const flags = continuityFlags(); toast(flags.length ? `${flags.length} continuity item${flags.length > 1 ? 's' : ''} flagged for review.` : 'Continuity check complete: no active conflicts found.'); document.getElementById('app').classList.add('inspector-open'); }
          else if (action === 'issue-from-flag') { const issue = { id: uid(), title: 'Continuity review needed', type: 'Continuity', priority: 'High', note: message, chapterId: currentChapter().id, createdAt: now(), resolved: false }; data.issues.unshift(issue); logEvent('Continuity issue filed', issue.title, issue.note, issue.chapterId); persist('Continuity flag added to the revision ledger.'); render(); }
          else if (action === 'mark-intentional') { if (!data.intentional.some(item => item.fingerprint === fingerprint)) { data.intentional.unshift({ fingerprint, message, at: now() }); logEvent('Continuity intention', 'Exception marked intentional', message); persist('Intent bubble recorded. This rule will remain quiet.'); render(); } }
          else if (action === 'remove-intentional') { data.intentional = data.intentional.filter(item => item.fingerprint !== fingerprint); persist('Intent bubble removed. The checker will watch this line again.'); render(); }
          else if (action === 'export-data') { exportData(); closeModal(); }
          else if (action === 'email-ready-backup') { prepareEmailBackup(); closeModal(); }
          else if (action === 'export-current-text') { exportCurrentText(); closeModal(); }
          else if (action === 'export-manuscript-text') { exportManuscriptText(); closeModal(); }
          else if (action === 'import-data') { closeModal(); importData(); }
          else if (action === 'reset-archive') { if (window.confirm('Reset this browser archive? Export a JSON backup first if you want to preserve anything.')) { data = blankState(); localStorage.removeItem(STORAGE_KEY); closeModal(); toast('The local archive was reset.'); render(); } }
        });
        document.addEventListener('keydown', event => { if (event.key === 'Escape') { closeModal(); document.getElementById('app').classList.remove('inspector-open'); } if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') { event.preventDefault(); saveDraft(true); } });
        setInterval(autosave, 30000);
        render();
      })();
    </script>
  </body>
</html>
