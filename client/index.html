<!doctype html>

    <title>The Ren Protocol</title>
    <link rel="icon" type="image/png" href="/manus-storage/ren-protocol-sigil_fa90a1ba.png" />
    <style>
      /*
        THE EMBER ARCHIVE — File-specific design reminder
        An editorial reading room: protected manuscript space, archive-grade metadata,
        charcoal and smoked indigo surfaces, with Archive Gold used only as a signal.
      */
      :root {
        --ink: #090a0f;
        --ink-2: #10121a;
        --ink-3: #171a24;
        --surface: rgba(21, 24, 34, 0.82);
        --surface-solid: #161923;
        --paper: #ede8da;
        --paper-muted: #a8a49d;
        --gold: #c9a84c;
        --gold-bright: #ecd37d;
        --gold-dim: rgba(201, 168, 76, 0.16);
        --line: rgba(237, 232, 218, 0.11);
        --line-gold: rgba(201, 168, 76, 0.35);
        --danger: #d8796c;
        --success: #7fae88;
        --serif: Georgia, "Times New Roman", serif;
        --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        --ease: cubic-bezier(0.23, 1, 0.32, 1);
      }

      * { box-sizing: border-box; }
      html { min-height: 100%; background: var(--ink); }
      body { margin: 0; min-height: 100vh; color: var(--paper); background: var(--ink); font-family: var(--sans); font-size: 14px; }
      button, input, textarea, select { font: inherit; }
      button { color: inherit; }
      button, [role="button"] { cursor: pointer; }
      button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }
      ::selection { background: rgba(201, 168, 76, 0.34); color: #fffdf5; }
      .app { min-height: 100vh; position: relative; isolation: isolate; overflow: hidden; }
      .app::before { content: ""; position: fixed; z-index: -2; inset: 0; background: linear-gradient(110deg, rgba(7,8,12,0.96), rgba(10,12,19,0.91) 46%, rgba(10,10,15,0.97)), url('/manus-storage/ren-protocol-ember-archive_6d6addd5.png') center/cover; }
      .app::after { content: ""; position: fixed; z-index: -1; inset: 0; pointer-events: none; opacity: .36; background-image: url('/manus-storage/ren-protocol-folio-texture_8a066d36.png'); background-size: 460px; mix-blend-mode: screen; }

      .shell { display: grid; grid-template-columns: 240px minmax(0, 1fr) 315px; min-height: 100vh; }
      .rail { position: relative; min-height: 100vh; border-right: 1px solid var(--line); background: rgba(8, 9, 14, .72); backdrop-filter: blur(18px); padding: 22px 16px 18px; display: flex; flex-direction: column; gap: 24px; }
      .rail::after { content: ""; position: absolute; top: 92px; bottom: 24px; left: 31px; width: 1px; background: linear-gradient(var(--gold), rgba(201,168,76,.08) 78%, transparent); opacity: .9; }
      .brand { display: flex; align-items: center; gap: 11px; min-height: 43px; position: relative; z-index: 1; }
      .brand-mark { width: 39px; height: 39px; padding: 7px; border: 1px solid var(--line-gold); border-radius: 12px 4px 12px 4px; background: rgba(201, 168, 76, .08); object-fit: contain; }
      .brand-text { line-height: 1; min-width: 0; }
      .brand-text strong { display: block; color: var(--paper); font: 700 17px/1 var(--serif); letter-spacing: .01em; white-space: nowrap; }
      .brand-text span { display: block; margin-top: 5px; color: var(--gold); font: 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; }
      .protocol-label { margin: 6px 0 -8px 25px; color: var(--paper-muted); font: 10px/1 var(--mono); letter-spacing: .15em; text-transform: uppercase; position: relative; z-index: 1; }
      .nav { display: grid; gap: 5px; position: relative; z-index: 1; }
      .nav-button { width: 100%; display: flex; align-items: center; gap: 11px; min-height: 43px; padding: 0 10px; border: 1px solid transparent; background: transparent; color: #aaa9a8; text-align: left; border-radius: 4px; transition: transform 160ms var(--ease), border-color 160ms var(--ease), color 160ms var(--ease), background 160ms var(--ease); }
      .nav-button:hover { color: var(--paper); background: rgba(255,255,255,.035); transform: translateX(2px); }
      .nav-button.active { color: var(--gold-bright); background: linear-gradient(90deg, rgba(201,168,76,.16), rgba(201,168,76,.02)); border-color: rgba(201,168,76,.19); }
      .nav-icon { width: 17px; height: 17px; flex: 0 0 17px; opacity: .93; }
      .nav-copy { display: grid; gap: 2px; }
      .nav-copy strong { font-size: 12px; font-weight: 650; }
      .nav-copy small { font: 9px/1 var(--mono); color: #7e7e83; letter-spacing: .07em; text-transform: uppercase; }
      .rail-bottom { margin-top: auto; position: relative; z-index: 1; }
      .local-card { padding: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.025); border-radius: 4px 12px 4px 4px; }
      .local-card .eyebrow { color: var(--gold); }
      .local-card p { margin: 7px 0 0; color: var(--paper-muted); font-size: 11px; line-height: 1.55; }
      .rail-footer { margin: 14px 0 0 4px; color: #65666d; font: 9px/1.5 var(--mono); letter-spacing: .08em; text-transform: uppercase; }

      .workspace { min-width: 0; padding: 0 26px 36px; }
      .topbar { height: 75px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); gap: 16px; }
      .breadcrumb { display: flex; align-items: center; gap: 9px; color: var(--paper-muted); min-width: 0; }
      .breadcrumb .kicker { color: var(--gold); font: 10px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase; }
      .breadcrumb .slash { color: #56555a; }
      .breadcrumb strong { overflow: hidden; color: var(--paper); font-weight: 550; text-overflow: ellipsis; white-space: nowrap; }
      .top-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
      .status { display: inline-flex; align-items: center; gap: 7px; color: #a9aca7; font: 10px/1 var(--mono); letter-spacing: .03em; }
      .status-dot { width: 6px; height: 6px; border-radius: 100%; background: var(--success); box-shadow: 0 0 0 3px rgba(127,174,136,.12); }
      .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 34px; border: 1px solid var(--line); border-radius: 4px; padding: 0 11px; background: rgba(255,255,255,.035); color: var(--paper); font-size: 11px; font-weight: 650; transition: transform 150ms var(--ease), background 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease); }
      .button:hover { transform: translateY(-1px); background: rgba(255,255,255,.07); border-color: rgba(237,232,218,.24); }
      .button:active { transform: scale(.97); }
      .button.gold { border-color: rgba(201,168,76,.65); background: linear-gradient(90deg, rgba(201,168,76,.17), rgba(201,168,76,.04)); color: var(--gold-bright); box-shadow: inset 0 0 0 1px rgba(201,168,76,.05); }
      .button.gold:hover { background: linear-gradient(90deg, rgba(201,168,76,.29), rgba(201,168,76,.10)); border-color: var(--gold-bright); }
      .button.ghost { border-color: transparent; background: transparent; color: var(--paper-muted); }
      .button.ghost:hover { color: var(--paper); background: rgba(255,255,255,.04); }
      .button.danger { color: #ed9a8f; }
      .button.small { min-height: 29px; padding: 0 8px; font-size: 10px; }
      .button svg { width: 14px; height: 14px; }

      .main-view { padding-top: 28px; animation: rise .22s var(--ease); }
      @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      .view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
      .view-head h1 { margin: 0; color: #f7f1e2; font: 500 clamp(30px,4vw,46px)/.95 var(--serif); letter-spacing: -.035em; }
      .view-head h1 em { color: var(--gold); font-weight: 400; }
      .view-head p { max-width: 470px; margin: 11px 0 0; color: var(--paper-muted); font-size: 12px; line-height: 1.55; }
      .eyebrow { color: var(--gold); font: 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; }

      .chapter-layout { display: grid; grid-template-columns: 184px minmax(0, 1fr); gap: 23px; align-items: start; }
      .chapter-index { position: sticky; top: 17px; overflow: hidden; border: 1px solid var(--line); background: rgba(16,18,26,.79); border-radius: 5px 5px 15px 5px; box-shadow: 0 18px 50px rgba(0,0,0,.17); }
      .index-title { display: flex; align-items: center; justify-content: space-between; padding: 13px 12px 10px; border-bottom: 1px solid var(--line); }
      .index-title span { color: var(--paper-muted); font: 9px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
      .index-title button { display: grid; place-items: center; width: 22px; height: 22px; border: 1px solid var(--line-gold); border-radius: 3px; background: var(--gold-dim); color: var(--gold-bright); }
      .chapter-list { padding: 6px; max-height: calc(100vh - 250px); overflow: auto; }
      .chapter-row { width: 100%; display: grid; gap: 4px; border: 1px solid transparent; border-left-color: transparent; padding: 10px 9px; border-radius: 3px; background: transparent; color: #aba9a8; text-align: left; transition: background 150ms var(--ease), border-color 150ms var(--ease); }
      .chapter-row:hover { background: rgba(255,255,255,.035); color: var(--paper); }
      .chapter-row.active { border-left-color: var(--gold); background: linear-gradient(90deg,rgba(201,168,76,.13),transparent); color: var(--paper); }
      .chapter-row strong { font: 600 11px/1.25 var(--serif); }
      .chapter-row small { color: #777881; font: 8px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; }
      .manuscript { min-width: 0; overflow: hidden; border: 1px solid rgba(237,232,218,.12); border-radius: 4px 4px 17px 4px; background: linear-gradient(135deg,rgba(245,238,219,.97),rgba(232,226,208,.98)); color: #27251f; box-shadow: 0 24px 80px rgba(0,0,0,.24); }
      .manuscript-top { display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 19px; border-bottom: 1px solid rgba(39,37,31,.12); background: rgba(255,255,255,.27); }
      .draft-tabs { display: flex; align-items: center; gap: 3px; }
      .draft-tab { min-height: 28px; padding: 0 8px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #777268; font: 9px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
      .draft-tab:hover { color: #353127; }
      .draft-tab.active { border-bottom-color: var(--gold); color: #312b1d; }
      .word-count { color: #817a6c; font: 9px/1 var(--mono); letter-spacing: .05em; }
      .manuscript-body { padding: clamp(25px,5vw,57px) clamp(22px,7vw,76px) 30px; background-image: linear-gradient(90deg, transparent 0, transparent 70px, rgba(117,100,69,.08) 70px, rgba(117,100,69,.08) 71px, transparent 71px); }
      .chapter-title-input { width: 100%; margin: 0 0 13px; border: 0; border-bottom: 1px solid rgba(39,37,31,.13); padding: 0 0 13px; outline: 0; background: transparent; color: #201e1a; font: 500 clamp(27px,4vw,42px)/1.08 var(--serif); letter-spacing: -.025em; }
      .chapter-title-input::placeholder, .editor::placeholder { color: #989184; }
      .chapter-dek { display: flex; gap: 14px; margin-bottom: 23px; color: #7f786d; font: 9px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase; }
      .editor { width: 100%; min-height: min(49vh, 570px); resize: vertical; border: 0; outline: 0; background: transparent; color: #343129; font: 400 clamp(17px,2vw,19px)/1.82 var(--serif); }
      .editor:focus { outline: 0; }
      .editor-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 15px; border-top: 1px solid rgba(39,37,31,.12); }
      .mention-helper { color: #716b60; font-size: 10px; line-height: 1.35; }
      .mention-helper code { color: #746023; font-family: var(--mono); }
      .paper-button { border: 1px solid rgba(49,43,29,.26); border-radius: 3px; padding: 8px 10px; background: #2b281f; color: #f4ebd5; font-size: 10px; font-weight: 700; }
      .paper-button:hover { background: #47402e; }
      .mention-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; padding: 12px clamp(22px,7vw,76px) 15px; border-top: 1px solid rgba(39,37,31,.12); background: rgba(255,255,255,.24); }
      .mention-strip .strip-label { margin-right: 4px; color: #777064; font: 9px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
      .mention-chip { border: 1px solid rgba(201,168,76,.4); border-radius: 999px; padding: 4px 8px; background: rgba(201,168,76,.12); color: #6e5410; font: 600 10px/1 var(--sans); }
      .mention-chip:hover { background: rgba(201,168,76,.25); }
      .empty-inline { color: #867f72; font-size: 10px; font-style: italic; }

      .masterbook-layout { display: grid; grid-template-columns: minmax(0, 1fr) 235px; gap: 20px; align-items: start; }
      .searchbox { position: relative; flex: 1 1 270px; max-width: 480px; }
      .searchbox svg { position: absolute; left: 11px; top: 10px; width: 15px; height: 15px; color: #83838a; }
      .searchbox input { width: 100%; height: 37px; border: 1px solid var(--line); border-radius: 4px; padding: 0 12px 0 34px; background: rgba(9,10,15,.52); color: var(--paper); font-size: 11px; }
      .searchbox input::placeholder { color: #777780; }
      .book-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .book-stack { display: grid; gap: 10px; }
      .book-section { overflow: hidden; border: 1px solid var(--line); border-radius: 4px 4px 13px 4px; background: rgba(17,19,28,.77); }
      .section-toggle { width: 100%; display: grid; grid-template-columns: 18px minmax(0,1fr) auto auto; align-items: center; gap: 9px; border: 0; padding: 14px 14px; background: transparent; color: var(--paper); text-align: left; }
      .section-toggle:hover { background: rgba(255,255,255,.025); }
      .section-toggle .category-icon { color: var(--gold); }
      .section-toggle strong { font: 600 14px/1 var(--serif); }
      .section-toggle small { color: #838289; font: 9px/1 var(--mono); }
      .chevron { width: 13px; color: #777780; transition: transform .18s var(--ease); }
      .book-section.closed .chevron { transform: rotate(-90deg); }
      .section-content { display: grid; gap: 9px; padding: 0 10px 11px; }
      .book-section.closed .section-content { display: none; }
      .entry-card { position: relative; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; padding: 12px; border: 1px solid rgba(255,255,255,.065); border-radius: 3px 9px 3px 3px; background: rgba(255,255,255,.025); }
      .entry-card::before { content: ""; position: absolute; left: 0; top: 13px; bottom: 13px; width: 2px; background: rgba(201,168,76,.45); }
      .entry-card-main { min-width: 0; padding-left: 6px; }
      .entry-card h3 { overflow: hidden; margin: 0; color: #f2eddf; font: 600 15px/1.1 var(--serif); text-overflow: ellipsis; white-space: nowrap; }
      .entry-card .meta { display: flex; flex-wrap: wrap; gap: 7px 12px; margin-top: 7px; color: #9a9999; font: 9px/1.35 var(--mono); letter-spacing: .03em; }
      .entry-card .description { display: -webkit-box; overflow: hidden; margin: 8px 0 0; color: #bbb8b0; font-size: 11px; line-height: 1.5; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
      .entry-actions { display: flex; align-items: flex-start; gap: 4px; }
      .icon-button { display: grid; place-items: center; width: 27px; height: 27px; border: 1px solid transparent; border-radius: 3px; background: transparent; color: #888991; }
      .icon-button:hover { color: var(--gold-bright); border-color: var(--line-gold); background: var(--gold-dim); }
      .icon-button svg { width: 14px; height: 14px; }
      .book-empty { border: 1px dashed rgba(237,232,218,.16); padding: 18px 15px; color: #8d8c91; font: 11px/1.5 var(--serif); text-align: center; }
      .world-card { overflow: hidden; border: 1px solid rgba(201,168,76,.2); border-radius: 4px 12px 4px 4px; background: #10131b; }
      .world-card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; opacity: .62; }
      .world-card-copy { margin-top: -62px; position: relative; padding: 13px; background: linear-gradient(transparent,rgba(10,11,16,.96) 36%); }
      .world-card-copy h3 { margin: 0; color: var(--paper); font: 600 20px/1 var(--serif); }
      .world-card-copy p { margin: 8px 0 0; color: #b7b2a4; font-size: 10px; line-height: 1.5; }
      .inventory { display: grid; gap: 9px; margin-top: 18px; }
      .inventory h3 { margin: 0 0 3px; color: var(--paper-muted); font: 9px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
      .inventory-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 7px; color: #b2b0ae; font-size: 11px; }
      .inventory-row strong { color: var(--gold-bright); font: 11px/1 var(--mono); }

      .timeline { max-width: 770px; border-left: 1px solid var(--line-gold); margin: 9px 0 0 9px; padding-left: 24px; }
      .timeline-event { position: relative; padding: 0 0 23px; }
      .timeline-event::before { content: ""; position: absolute; top: 3px; left: -30px; width: 11px; height: 11px; border: 2px solid var(--gold); border-radius: 50%; background: var(--ink-2); }
      .timeline-event:first-child::before { box-shadow: 0 0 0 4px rgba(201,168,76,.11); }
      .timeline-event time { display: block; margin-bottom: 5px; color: var(--gold); font: 9px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
      .timeline-event h3 { margin: 0; color: #ece6d9; font: 600 16px/1.1 var(--serif); }
      .timeline-event p { margin: 6px 0 0; color: #aaa8a6; font-size: 11px; line-height: 1.5; }
      .timeline-event .event-tag { display: inline-block; margin-top: 8px; color: #838289; font: 9px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
      .timeline-empty { border: 1px dashed var(--line); padding: 34px; color: #99969c; text-align: center; font: 15px/1.5 var(--serif); }

      .inspector { position: relative; min-height: 100vh; border-left: 1px solid var(--line); background: linear-gradient(180deg, rgba(22,24,31,.74), rgba(9,10,15,.62)); backdrop-filter: blur(18px); padding: 21px 16px; }
      .inspector::before { content: "FOLIO · CONTINUITY"; position: absolute; top: 94px; right: 5px; color: rgba(201,168,76,.24); font: 8px/1 var(--mono); letter-spacing: .16em; writing-mode: vertical-rl; pointer-events: none; }
      .inspector-head { display: flex; align-items: center; justify-content: space-between; padding: 0 3px 15px; border-bottom: 1px solid var(--line); }
      .inspector-head h2 { margin: 0; color: var(--paper); font: 600 15px/1 var(--serif); }
      .inspector-head span { color: var(--gold); font: 9px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
      .continuity-score { display: flex; align-items: center; gap: 14px; margin-top: 12px; padding: 14px 12px; border: 1px solid rgba(237,232,218,.08); border-left: 2px solid rgba(201,168,76,.58); background: repeating-linear-gradient(0deg, rgba(201,168,76,.025) 0 1px, transparent 1px 22px); }
      .score-ring { position: relative; display: grid; place-items: center; width: 47px; height: 47px; border: 2px solid var(--gold); border-radius: 50%; color: var(--gold-bright); font: 10px/1 var(--mono); }
      .score-ring::after { content: ""; position: absolute; inset: 4px; border: 1px solid rgba(201,168,76,.35); border-radius: 50%; }
      .score-copy { min-width: 0; }
      .score-copy strong { display: block; color: #e9e4d8; font-size: 11px; }
      .score-copy span { display: block; margin-top: 4px; color: #929095; font-size: 10px; line-height: 1.4; }
      .check-button { width: 100%; margin: 13px 0 15px; }
      .flag-list { display: grid; gap: 8px; }
      .flag { padding: 11px; border: 1px solid rgba(216,121,108,.27); border-radius: 3px 10px 3px 3px; background: rgba(216,121,108,.075); }
      .flag.intentional { border-color: rgba(127,174,136,.28); background: rgba(127,174,136,.07); }
      .flag-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
      .flag-kind { color: #e9998e; font: 9px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
      .flag.intentional .flag-kind { color: #9acaa4; }
      .flag p { margin: 7px 0 10px; color: #c5c1ba; font-size: 10px; line-height: 1.48; }
      .flag .intent { padding: 0; min-height: auto; border: 0; background: transparent; color: var(--gold-bright); font: 600 9px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; }
      .flag .intent:hover { text-decoration: underline; }
      .clear-state { padding: 17px 3px; color: #a8bda8; font: 15px/1.45 var(--serif); }
      .clear-state small { display: block; margin-top: 6px; color: #8c908a; font: 10px/1.45 var(--sans); }
      .inspector-section { margin-top: 23px; }
      .inspector-section h3 { margin: 0 0 9px; color: var(--paper-muted); font: 9px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
      .intent-list { display: grid; gap: 5px; }
      .intent-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 7px; padding: 8px 0; border-bottom: 1px solid var(--line); color: #a6aaa3; font-size: 10px; line-height: 1.35; }
      .intent-row button { flex: 0 0 auto; border: 0; background: none; color: #888; font-size: 14px; line-height: 1; }
      .intent-row button:hover { color: var(--danger); }

      .modal-backdrop { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; padding: 18px; background: rgba(4,5,9,.71); backdrop-filter: blur(8px); animation: fade .18s var(--ease); }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      .modal { width: min(650px,100%); max-height: min(760px, calc(100vh - 36px)); overflow: auto; border: 1px solid rgba(201,168,76,.38); border-radius: 5px 16px 5px 5px; background: #171a24; box-shadow: 0 28px 110px rgba(0,0,0,.55); animation: modalin .22s var(--ease); }
      @keyframes modalin { from { opacity: 0; transform: translateY(9px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 21px 22px 17px; border-bottom: 1px solid var(--line); }
      .modal-head h2 { margin: 6px 0 0; color: #f1ecdf; font: 500 27px/1 var(--serif); }
      .modal-close { display: grid; place-items: center; width: 29px; height: 29px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: #a8a7aa; }
      .modal-close:hover { color: var(--paper); background: rgba(255,255,255,.06); }
      .modal-body { padding: 20px 22px; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .field { display: grid; gap: 7px; }
      .field.full { grid-column: 1 / -1; }
      .field label { color: #aaa7a0; font: 9px/1 var(--mono); letter-spacing: .11em; text-transform: uppercase; }
      .field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line); border-radius: 3px; padding: 9px 10px; background: #0d0f16; color: #ece7da; font-size: 12px; }
      .field textarea { min-height: 92px; resize: vertical; line-height: 1.5; }
      .field .hint { color: #777880; font-size: 9px; line-height: 1.45; }
      .modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 15px 22px 20px; border-top: 1px solid var(--line); }
      .profile-grid { display: grid; gap: 18px; }
      .profile-dek { margin: 0; color: #b9b5ac; font: 14px/1.55 var(--serif); }
      .data-list { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px 16px; }
      .data-pair { border-top: 1px solid var(--line); padding-top: 8px; }
      .data-pair small { display: block; color: #8c8b91; font: 8px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
      .data-pair span { display: block; margin-top: 5px; color: #e2ddd2; font-size: 11px; line-height: 1.4; }
      .history-list { display: grid; gap: 0; border-top: 1px solid var(--line); }
      .history-item { padding: 9px 0; border-bottom: 1px solid var(--line); }
      .history-item time { display: block; color: var(--gold); font: 9px/1 var(--mono); }
      .history-item p { margin: 5px 0 0; color: #b7b5b0; font-size: 10px; }
      .toast { position: fixed; z-index: 40; right: 20px; bottom: 20px; max-width: min(360px,calc(100vw - 40px)); padding: 12px 14px; border: 1px solid var(--line-gold); border-radius: 4px 10px 4px 4px; background: #1b1d25; box-shadow: 0 14px 40px rgba(0,0,0,.35); color: #eee8db; font-size: 11px; opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .2s var(--ease), transform .2s var(--ease); }
      .toast.show { opacity: 1; transform: translateY(0); }

      @media (max-width: 1130px) {
        .shell { grid-template-columns: 215px minmax(0,1fr); }
        .inspector { position: fixed; z-index: 8; right: 0; top: 0; width: min(340px, 90vw); min-height: 100vh; transform: translateX(102%); transition: transform .24s var(--ease); box-shadow: -20px 0 60px rgba(0,0,0,.3); }
        .app.inspector-open .inspector { transform: translateX(0); }
        .inspector-toggle { display: inline-flex; }
      }
      @media (min-width: 1131px) { .inspector-toggle { display: none; } }
      @media (max-width: 760px) {
        body { font-size: 13px; }
        .app { overflow: visible; }
        .shell { display: block; }
        .rail { min-height: auto; padding: 13px 13px 10px; border-right: 0; border-bottom: 1px solid var(--line); gap: 10px; }
        .rail::after, .protocol-label, .rail-bottom, .rail-footer { display: none; }
        .brand { padding-left: 3px; }
        .nav { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; overflow: auto; padding-bottom: 2px; }
        .nav-button { min-height: 39px; justify-content: center; padding: 0 7px; }
        .nav-copy small { display: none; }
        .nav-copy strong { font-size: 10px; white-space: nowrap; }
        .workspace { padding: 0 14px 28px; }
        .topbar { height: 58px; }
        .breadcrumb .kicker, .breadcrumb .slash { display: none; }
        .status { display: none; }
        .top-actions .button:not(.inspector-toggle) { display: none; }
        .view-head { display: block; margin-bottom: 17px; }
        .view-head h1 { font-size: 35px; }
        .chapter-layout, .masterbook-layout { display: block; }
        .chapter-index { position: static; margin-bottom: 11px; }
        .chapter-list { display: flex; gap: 5px; max-height: none; overflow: auto; }
        .chapter-row { flex: 0 0 130px; }
        .manuscript-body { background-image: none; }
        .editor { min-height: 45vh; font-size: 17px; }
        .draft-tabs { overflow: auto; max-width: 75%; }
        .draft-tab { padding: 0 6px; white-space: nowrap; }
        .word-count { display: none; }
        .book-actions { margin-top: 15px; }
        .world-card { display: none; }
        .form-grid { grid-template-columns: 1fr; }
        .field.full { grid-column: auto; }
        .data-list { grid-template-columns: 1fr; }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <div id="app" class="app"></div>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
      /*
        THE EMBER ARCHIVE — File-specific design reminder
        Keep author data private and local. Interactions should behave like precise editorial tools:
        direct, calm, and available without ever leaving the manuscript context.
      */
      (() => {
        'use strict';

        const STORAGE_KEY = 'the-ren-protocol.v1';
        const categories = {
          characters: { label: 'Characters', singular: 'Character', icon: 'person', fields: [['name','Name','text',''],['role','Role','text',''],['description','Description','textarea',''],['stats','Stats','text',''],['relationships','Relationships','text',''],['status','Status','select','Active|Missing|Deceased|Unknown']] },
          worldRules: { label: 'World Rules', singular: 'World Rule', icon: 'rule', fields: [['name','Rule title','text',''],['description','Rule detail','textarea',''],['watchTerms','Keywords to watch','text',''],['conflictTerms','Conflict words','text',''],['status','Status','select','Canonical|Experimental|Retired']] },
          locations: { label: 'Locations', singular: 'Location', icon: 'pin', fields: [['name','Name','text',''],['description','Description','textarea',''],['connected','Connected characters','text',''],['danger','Danger level','select','Low|Moderate|High|Extreme'],['notes','Continuity notes','text','']] },
          lore: { label: 'Lore', singular: 'Lore entry', icon: 'book', fields: [['name','Term','text',''],['definition','Definition','textarea',''],['culturalNotes','Cultural notes','text',''],['related','Related entries','text','']] }
        };

        const svg = {
          write: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
          book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>',
          clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
          rule: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m4 13 4 4L20 5"/></svg>',
          person: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.2"/><path d="M5 21c.7-4 2.8-6 7-6s6.3 2 7 6"/></svg>',
          pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.4"/></svg>',
          plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 5v14M5 12h14"/></svg>',
          search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>',
          chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 9 6 6 6-6"/></svg>',
          eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 12s3.2-6 9.5-6 9.5 6 9.5 6-3.2 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>',
          edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
          trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M10 11v5M14 11v5M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
          panel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>',
          download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 20h16"/></svg>'
        };

        const uid = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`;
        const now = () => new Date().toISOString();
        const esc = (value = '') => String(value).replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#039;', '"':'&quot;' }[char]));
        const clone = obj => JSON.parse(JSON.stringify(obj));
        const getWords = text => (text.trim().match(/\S+/g) || []).length;
        const formatDate = iso => new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(iso));
        const timeAgo = iso => { const diff = Math.max(0, Date.now() - new Date(iso).getTime()); const mins = Math.round(diff / 60000); if (mins < 1) return 'just now'; if (mins < 60) return `${mins} min ago`; const hrs = Math.round(mins / 60); if (hrs < 24) return `${hrs} hr ago`; return `${Math.round(hrs / 24)} d ago`; };

        function newChapter(number = 1) {
          const created = now();
          return { id: uid(), number, title: `Chapter ${String(number).padStart(2, '0')}: Untitled`, createdAt: created, updatedAt: created, versions: { first: '', main: '', final: '' }, activeVersion: 'main' };
        }
        function blankState() {
          const chapter = newChapter();
          return { masterbook: { characters: [], worldRules: [], locations: [], lore: [] }, chapters: [chapter], activeChapterId: chapter.id, timeline: [], intentional: [], collapsed: [], activeView: 'chapter', draft: '', lastSavedAt: null, selectedVersion: 'main' };
        }
        function loadState() {
          try {
            const loaded = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
            if (loaded && loaded.masterbook && Array.isArray(loaded.chapters)) return { ...blankState(), ...loaded, masterbook: { ...blankState().masterbook, ...loaded.masterbook } };
          } catch (error) { console.warn('The Ren Protocol archive could not be read.', error); }
          return blankState();
        }
        let data = loadState();
        let searchTerm = '';
        let toastTimer;

        function currentChapter() {
          let chapter = data.chapters.find(item => item.id === data.activeChapterId);
          if (!chapter) { chapter = data.chapters[0] || newChapter(); data.activeChapterId = chapter.id; }
          return chapter;
        }
        function currentDraft() { return data.draft ?? currentChapter().versions[data.selectedVersion || 'main'] ?? ''; }
        function persist(message, quiet = false) {
          data.lastSavedAt = now();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          if (!quiet && message) toast(message);
        }
        function toast(message) {
          const element = document.getElementById('toast');
          element.textContent = message;
          element.classList.add('show');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => element.classList.remove('show'), 2700);
        }
        function logEvent(kind, title, summary, chapterId = null) {
          data.timeline.unshift({ id: uid(), at: now(), kind, title, summary, chapterId });
          data.timeline = data.timeline.slice(0, 250);
        }
        function navButton(view, icon, title, sub) {
          return `<button class="nav-button ${data.activeView === view ? 'active' : ''}" data-action="set-view" data-view="${view}"><span class="nav-icon">${svg[icon]}</span><span class="nav-copy"><strong>${title}</strong><small>${sub}</small></span></button>`;
        }
        function appShell(main) {
          const activeChapter = currentChapter();
          return `<div class="shell">
        <aside class="rail" aria-label="Primary navigation">
              <div class="brand"><img class="brand-mark" src="/manus-storage/ren-protocol-sigil_fa90a1ba.png" alt="The Ren Protocol mark"><div class="brand-text"><strong>The Ren Protocol</strong><span>Private manuscript archive</span></div></div>
              <div class="protocol-label">Archive navigation</div>
              <nav class="nav">${navButton('chapter','write','Chapter Stream','Write & revise')}${navButton('masterbook','book','Masterbook','World bible')}${navButton('timeline','clock','Timeline','Change log')}</nav>
              <div class="rail-bottom"><div class="local-card"><div class="eyebrow">Novel / Neo Domain Online</div><p>Your manuscript, notes, drafts, and continuity intentions remain in this browser’s local storage.</p></div><div class="rail-footer">Archive no. 01 · local-only</div></div>
            </aside>
            <main class="workspace">
              <header class="topbar"><div class="breadcrumb"><span class="kicker">Private manuscript archive</span><span class="slash">/</span><strong>${data.activeView === 'chapter' ? esc(activeChapter.title) : data.activeView === 'masterbook' ? 'Masterbook' : 'Chronicle timeline'}</strong></div><div class="top-actions"><span class="status"><i class="status-dot"></i><span>${data.lastSavedAt ? `Filed ${timeAgo(data.lastSavedAt)}` : 'Local archive'}</span></span><button class="button ghost inspector-toggle" data-action="toggle-inspector">${svg.panel} <span>Review</span></button><button class="button" data-action="export-data">${svg.download} <span>Export</span></button><button class="button gold" data-action="save-draft">File draft</button></div></header>
              ${main}
            </main>
            ${renderInspector()}
          </div>`;
        }
        function render() {
          document.getElementById('app').innerHTML = data.activeView === 'masterbook' ? appShell(renderMasterbook()) : data.activeView === 'timeline' ? appShell(renderTimeline()) : appShell(renderChapter());
          bindInputEvents();
        }
        function renderChapter() {
          const chapter = currentChapter();
          const draft = currentDraft();
          const mentions = findMentions(draft);
          const wordCount = getWords(draft);
          return `<section class="main-view">
            <div class="view-head"><div><div class="eyebrow">Chapter Stream / ${data.selectedVersion === 'first' ? 'First draft' : data.selectedVersion === 'main' ? 'Main draft' : 'Final draft'}</div><h1>Return to <em>the line</em> that matters.</h1><p>Draft in a quiet manuscript space. Save deliberately, or let the local archive catch your work every thirty seconds.</p></div></div>
            <div class="chapter-layout">
              <section class="chapter-index" aria-label="Chapter list"><div class="index-title"><span>Folio sequence</span><button title="New chapter" aria-label="New chapter" data-action="new-chapter">${svg.plus}</button></div><div class="chapter-list">${data.chapters.map(item => `<button class="chapter-row ${item.id === chapter.id ? 'active' : ''}" data-action="select-chapter" data-id="${item.id}"><strong>${esc(item.title)}</strong><small>Folio ${String(item.number).padStart(2,'0')} · ${getWords(item.versions.main || '')} words</small></button>`).join('')}</div></section>
              <article class="manuscript"><div class="manuscript-top"><div class="draft-tabs">${[['first','First Draft'],['main','Main Draft'],['final','Final Draft']].map(([key,label]) => `<button class="draft-tab ${data.selectedVersion === key ? 'active' : ''}" data-action="switch-version" data-version="${key}">${label}</button>`).join('')}</div><span class="word-count">${wordCount.toLocaleString()} words</span></div>
                <div class="manuscript-body"><input id="chapter-title" class="chapter-title-input" aria-label="Chapter title" value="${esc(chapter.title)}" placeholder="Name this chapter"><div class="chapter-dek"><span>${data.selectedVersion === 'first' ? 'First pass' : data.selectedVersion === 'main' ? 'Working manuscript' : 'Publication read'}</span><span>·</span><span>Local document</span></div><textarea id="chapter-editor" class="editor" spellcheck="true" aria-label="Chapter writing area" placeholder="Begin the scene. Type @ followed by a character name to mark a connection.">${esc(draft)}</textarea><div class="editor-tools"><span class="mention-helper">Mention a character with <code>@Name</code>. Linked entries appear below.</span><button class="paper-button" data-action="save-draft">Save to ${data.selectedVersion === 'first' ? 'First Draft' : data.selectedVersion === 'main' ? 'Main Draft' : 'Final Draft'}</button></div></div>
                <div class="mention-strip"><span class="strip-label">Linked mentions</span>${mentions.length ? mentions.map(entry => `<button class="mention-chip" data-action="view-entry" data-category="characters" data-id="${entry.id}">@${esc(entry.name)}</button>`).join('') : '<span class="empty-inline">No linked character names in this version yet.</span>'}</div>
              </article>
            </div>
          </section>`;
        }
        function renderMasterbook() {
          const total = Object.values(data.masterbook).reduce((sum, list) => sum + list.length, 0);
          return `<section class="main-view"><div class="view-head"><div><div class="eyebrow">Masterbook / Story Bible</div><h1>The world stays <em>legible.</em></h1><p>Store canonical people, rules, locations, and lore in one local archive. Each record keeps its own edit history.</p></div><div class="book-actions"><div class="searchbox">${svg.search}<input id="book-search" value="${esc(searchTerm)}" placeholder="Search every record" aria-label="Search Masterbook"></div><button class="button gold" data-action="open-entry-form" data-category="characters">${svg.plus} Add entry</button></div></div>
            <div class="masterbook-layout"><div class="book-stack">${Object.entries(categories).map(([key, category]) => renderSection(key, category)).join('')}</div><aside><div class="world-card"><img src="/manus-storage/ren-protocol-world-card_e6bd6149.png" alt="Abstract representation of an imagined world archive"><div class="world-card-copy"><div class="eyebrow">World matrix</div><h3>Canonical, local.</h3><p>Define what the draft must remember, then let the protocol watch the line.</p></div></div><div class="inventory"><h3>Archive inventory</h3>${Object.entries(categories).map(([key, c]) => `<div class="inventory-row"><span>${c.label}</span><strong>${data.masterbook[key].length}</strong></div>`).join('')}<div class="inventory-row"><span>All records</span><strong>${total}</strong></div></div></aside></div>
          </section>`;
        }
        function renderSection(key, category) {
          const entries = filterEntries(data.masterbook[key]);
          const collapsed = data.collapsed.includes(key);
          return `<section class="book-section ${collapsed ? 'closed' : ''}"><button class="section-toggle" data-action="toggle-section" data-category="${key}"><span class="category-icon">${svg[category.icon]}</span><strong>${category.label}</strong><small>${entries.length}${searchTerm ? ` / ${data.masterbook[key].length}` : ''}</small><span class="chevron">${svg.chevron}</span></button><div class="section-content">${entries.length ? entries.map(entry => renderEntry(key, entry)).join('') : `<div class="book-empty">${searchTerm ? 'No records match this search.' : `No ${category.label.toLowerCase()} recorded. Add the first canonical ${category.singular.toLowerCase()} when you are ready.`}</div>`}<button class="button small ghost" data-action="open-entry-form" data-category="${key}">${svg.plus} Add ${category.singular}</button></div></section>`;
        }
        function filterEntries(entries) {
          if (!searchTerm.trim()) return entries;
          const query = searchTerm.trim().toLowerCase();
          return entries.filter(entry => Object.values(entry).some(value => typeof value === 'string' && value.toLowerCase().includes(query)));
        }
        function entryDescription(category, entry) { return entry.description || entry.definition || entry.notes || entry.culturalNotes || ''; }
        function entryMetadata(category, entry) {
          if (category === 'characters') return [entry.role, entry.status].filter(Boolean);
          if (category === 'worldRules') return [entry.status, entry.watchTerms ? `watch: ${entry.watchTerms}` : ''].filter(Boolean);
          if (category === 'locations') return [entry.danger ? `${entry.danger} danger` : '', entry.connected].filter(Boolean);
          return [entry.related, entry.culturalNotes].filter(Boolean);
        }
        function renderEntry(category, entry) {
          const meta = entryMetadata(category, entry);
          return `<article class="entry-card"><div class="entry-card-main"><h3>${esc(entry.name || 'Untitled record')}</h3>${meta.length ? `<div class="meta">${meta.map(value => `<span>${esc(value)}</span>`).join('')}</div>` : ''}${entryDescription(category, entry) ? `<p class="description">${esc(entryDescription(category, entry))}</p>` : ''}</div><div class="entry-actions"><button class="icon-button" title="View record" aria-label="View record" data-action="view-entry" data-category="${category}" data-id="${entry.id}">${svg.eye}</button><button class="icon-button" title="View history" aria-label="View history" data-action="view-history" data-category="${category}" data-id="${entry.id}">${svg.clock}</button><button class="icon-button" title="Edit record" aria-label="Edit record" data-action="open-entry-form" data-category="${category}" data-id="${entry.id}">${svg.edit}</button><button class="icon-button" title="Delete record" aria-label="Delete record" data-action="delete-entry" data-category="${category}" data-id="${entry.id}">${svg.trash}</button></div></article>`;
        }
        function renderTimeline() {
          const events = [...data.timeline].sort((a,b) => new Date(b.at) - new Date(a.at));
          return `<section class="main-view"><div class="view-head"><div><div class="eyebrow">Chronicle timeline</div><h1>Every change leaves <em>a trace.</em></h1><p>Your local editorial log captures when chapters and Masterbook records changed, newest first. It never leaves this device.</p></div></div><div class="timeline">${events.length ? events.map(event => `<article class="timeline-event"><time>${formatDate(event.at)}</time><h3>${esc(event.title)}</h3><p>${esc(event.summary)}</p><span class="event-tag">${esc(event.kind)}</span></article>`).join('') : '<div class="timeline-empty">The timeline is quiet. Your writing and archive changes will be recorded here.</div>'}</div></section>`;
        }
        function renderInspector() {
          const flags = continuityFlags();
          const hiddenCount = allContinuityFlags().filter(flag => data.intentional.some(item => item.fingerprint === flag.fingerprint)).length;
          const score = Math.max(0, 100 - flags.length * 16);
          return `<aside class="inspector" aria-label="Continuity checker"><div class="inspector-head"><h2>Continuity ledger</h2><span>Folio / 01</span></div><div class="continuity-score"><div class="score-ring">${score}</div><div class="score-copy"><strong>${flags.length ? `${flags.length} item${flags.length > 1 ? 's' : ''} need review` : 'The line is clear'}</strong><span>${flags.length ? 'Compare the current draft to canonical records.' : 'No active conflicts found in this folio.'}</span></div></div><button class="button gold check-button" data-action="run-check">${svg.rule} Review current folio</button><div class="flag-list">${flags.length ? flags.map(flag => `<article class="flag"><div class="flag-top"><span class="flag-kind">${esc(flag.kind)} / annotation</span></div><p>${esc(flag.message)}</p><button class="intent" data-action="mark-intentional" data-fingerprint="${esc(flag.fingerprint)}" data-message="${esc(flag.message)}">Mark intentional</button></article>`).join('') : `<div class="clear-state">${allContinuityFlags().length ? 'Every detected exception is marked intentional.' : 'No live annotations yet.'}<small>${allContinuityFlags().length ? 'Undo an intention below if this folio needs another review.' : 'Add character statuses or world-rule conflict words in the Masterbook to activate local annotations.'}</small></div>`}</div><div class="inspector-section"><h3>Intent bubbles ${data.intentional.length ? `(${data.intentional.length})` : ''}</h3><div class="intent-list">${data.intentional.length ? data.intentional.map(item => `<div class="intent-row"><span>${esc(item.message)}</span><button title="Remove intention" aria-label="Remove intention" data-action="remove-intentional" data-fingerprint="${esc(item.fingerprint)}">×</button></div>`).join('') : '<div class="empty-inline">No exceptions recorded.</div>'}</div></div></aside>`;
        }
        function findMentions(text) {
          const lookup = data.masterbook.characters;
          return lookup.filter(entry => entry.name && new RegExp(`(^|[^\\w])@${escapeRegex(entry.name)}(?=$|[^\\w])`, 'i').test(text));
        }
        function escapeRegex(value) { return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
        function allContinuityFlags() {
          const text = currentDraft();
          const plain = text.toLowerCase();
          if (!text.trim()) return [];
          const flags = [];
          data.masterbook.characters.forEach(entry => {
            const status = (entry.status || '').toLowerCase();
            const cited = new RegExp(`@${escapeRegex(entry.name)}\\b`, 'i').test(text);
            const activeVerbs = new RegExp(`${escapeRegex(entry.name)}[^.?!]{0,55}\\b(walked|said|spoke|arrived|smiled|looked|entered|fought|ran)\\b`, 'i').test(text);
            if (entry.name && /(deceased|dead|missing)/.test(status) && (cited || activeVerbs)) flags.push({ fingerprint: `character:${entry.id}:${status}`, kind: 'Character status', message: `${entry.name} is recorded as ${entry.status}. The current draft may place them in an active scene.` });
          });
          data.masterbook.worldRules.forEach(entry => {
            const conflicts = (entry.conflictTerms || '').split(',').map(x => x.trim()).filter(Boolean);
            conflicts.forEach(term => { if (plain.includes(term.toLowerCase())) flags.push({ fingerprint: `rule:${entry.id}:${term.toLowerCase()}`, kind: 'World rule', message: `“${term}” appears in this draft and is listed as a conflict word for “${entry.name}”.` }); });
          });
          data.masterbook.locations.forEach(entry => {
            if (entry.name && /high|extreme/i.test(entry.danger || '') && new RegExp(`\\b${escapeRegex(entry.name)}\\b`, 'i').test(text) && /\b(safe|harmless|secure)\b/i.test(text)) flags.push({ fingerprint: `location:${entry.id}:danger`, kind: 'Location constraint', message: `${entry.name} is marked ${entry.danger} danger, but the draft describes a safe or harmless condition.` });
          });
          return flags;
        }
        function continuityFlags() { return allContinuityFlags().filter(flag => !data.intentional.some(item => item.fingerprint === flag.fingerprint)); }
        function setDraft(value) { data.draft = value; document.querySelector('.word-count')?.replaceChildren(document.createTextNode(`${getWords(value).toLocaleString()} words`)); }
        function saveDraft(announce = true) {
          const chapter = currentChapter();
          const content = document.getElementById('chapter-editor')?.value ?? data.draft ?? '';
          const title = document.getElementById('chapter-title')?.value.trim() || chapter.title;
          const changed = chapter.versions[data.selectedVersion] !== content || chapter.title !== title;
          chapter.title = title;
          chapter.versions[data.selectedVersion] = content;
          chapter.updatedAt = now();
          data.draft = content;
          if (changed) logEvent('Chapter saved', chapter.title, `${data.selectedVersion === 'first' ? 'First Draft' : data.selectedVersion === 'main' ? 'Main Draft' : 'Final Draft'} saved · ${getWords(content).toLocaleString()} words`, chapter.id);
          persist(announce ? `${data.selectedVersion === 'first' ? 'First Draft' : data.selectedVersion === 'main' ? 'Main Draft' : 'Final Draft'} saved locally.` : '', !announce);
          if (announce) render();
        }
        function autosave() {
          const editor = document.getElementById('chapter-editor');
          if (!editor) return;
          const title = document.getElementById('chapter-title')?.value.trim() || currentChapter().title;
          const chapter = currentChapter();
          chapter.title = title;
          chapter.versions[data.selectedVersion] = editor.value;
          chapter.updatedAt = now();
          data.draft = editor.value;
          persist('', true);
          const status = document.querySelector('.status span:last-child');
          if (status) status.textContent = 'Autosaved locally';
        }
        function bindInputEvents() {
          const editor = document.getElementById('chapter-editor');
          if (editor) editor.addEventListener('input', event => { setDraft(event.target.value); setTimeout(() => updateMentionStrip(event.target.value), 0); });
          document.getElementById('chapter-title')?.addEventListener('input', event => { currentChapter().title = event.target.value; });
          document.getElementById('book-search')?.addEventListener('input', event => { searchTerm = event.target.value; render(); document.getElementById('book-search')?.focus(); });
        }
        function updateMentionStrip(text) {
          const strip = document.querySelector('.mention-strip');
          if (!strip) return;
          const matches = findMentions(text);
          strip.innerHTML = `<span class="strip-label">Linked mentions</span>${matches.length ? matches.map(entry => `<button class="mention-chip" data-action="view-entry" data-category="characters" data-id="${entry.id}">@${esc(entry.name)}</button>`).join('') : '<span class="empty-inline">No linked character names in this version yet.</span>'}`;
        }
        function openEntryForm(category, id = null) {
          const entry = id ? data.masterbook[category].find(item => item.id === id) : null;
          const definition = categories[category];
          const fields = definition.fields.map(([key,label,type,options]) => {
            const value = entry?.[key] || '';
            if (type === 'textarea') return `<div class="field full"><label for="field-${key}">${label}</label><textarea id="field-${key}" name="${key}" placeholder="${label}">${esc(value)}</textarea>${key === 'description' || key === 'definition' ? '<span class="hint">This is the short canonical explanation used throughout your archive.</span>' : ''}</div>`;
            if (type === 'select') return `<div class="field"><label for="field-${key}">${label}</label><select id="field-${key}" name="${key}">${options.split('|').map(option => `<option value="${esc(option)}" ${value === option ? 'selected' : ''}>${esc(option)}</option>`).join('')}</select></div>`;
            return `<div class="field"><label for="field-${key}">${label}</label><input id="field-${key}" name="${key}" value="${esc(value)}" placeholder="${label}">${key === 'conflictTerms' ? '<span class="hint">Comma-separated. The checker flags these terms in a chapter.</span>' : ''}</div>`;
          }).join('');
          modal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><div class="eyebrow">Masterbook / ${esc(definition.label)}</div><h2 id="modal-title">${entry ? 'Edit' : 'Add'} ${definition.singular}</h2></div><button class="modal-close" data-action="close-modal" aria-label="Close">×</button></div><form id="entry-form"><div class="modal-body"><div class="form-grid">${fields}</div></div><div class="modal-foot"><button type="button" class="button" data-action="close-modal">Cancel</button><button id="entry-save" type="button" class="button gold" onclick="window.renSaveEntry('${category}', '${id || ''}')">${entry ? 'Save record' : 'Add record'}</button></div></form></div>`, () => {
            document.getElementById('entry-form').addEventListener('submit', event => { event.preventDefault(); saveEntryForm(category, id); });
            setTimeout(() => document.querySelector('#entry-form input, #entry-form textarea')?.focus(), 30);
          });
        }
        function saveEntryForm(category, id) {
          const definition = categories[category];
          const old = id ? data.masterbook[category].find(item => item.id === id) : null;
          const record = old ? clone(old) : { id: uid(), history: [] };
          definition.fields.forEach(([key]) => { record[key] = document.querySelector(`#entry-form [name="${key}"]`)?.value.trim() || ''; });
          if (!record.name) { toast('A canonical record needs a name.'); return; }
          record.history = record.history || [];
          record.history.unshift({ at: now(), action: old ? 'Record updated' : 'Record created', summary: old ? `Updated ${record.name}.` : `Created ${record.name}.` });
          if (old) { Object.assign(old, record); logEvent('Masterbook updated', `${record.name} revised`, `${definition.singular} record updated in the Masterbook.`); } else { data.masterbook[category].unshift(record); logEvent('Masterbook added', `${record.name} added`, `${definition.singular} record added to the Masterbook.`); }
          persist(`${record.name} saved to the Masterbook.`); closeModal(); render();
        }
        window.renSaveEntry = (category, id) => saveEntryForm(category, id || null);
        function viewEntry(category, id) {
          const entry = data.masterbook[category].find(item => item.id === id);
          if (!entry) return;
          const definition = categories[category];
          const pairs = definition.fields.filter(([key]) => entry[key]).map(([key,label]) => `<div class="data-pair"><small>${esc(label)}</small><span>${esc(entry[key])}</span></div>`).join('');
          const history = (entry.history || []).length ? entry.history.map(item => `<div class="history-item"><time>${formatDate(item.at)}</time><p>${esc(item.action)} — ${esc(item.summary)}</p></div>`).join('') : '<div class="empty-inline">No changes recorded yet.</div>';
          modal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><div class="eyebrow">${esc(definition.label)} / Canonical record</div><h2 id="modal-title">${esc(entry.name)}</h2></div><button class="modal-close" data-action="close-modal" aria-label="Close">×</button></div><div class="modal-body"><div class="profile-grid"><p class="profile-dek">${esc(entryDescription(category, entry) || 'No canonical description has been recorded for this entry.')}</p><div class="data-list">${pairs}</div><div><div class="eyebrow">Record history</div><div class="history-list">${history}</div></div></div></div><div class="modal-foot"><button class="button" data-action="close-modal">Close</button><button class="button gold" data-action="edit-from-profile" data-category="${category}" data-id="${id}">${svg.edit} Edit record</button></div></div>`);
        }
        function modal(content, onOpen) { document.getElementById('modal-root').innerHTML = `<div class="modal-backdrop" data-action="close-modal-backdrop">${content}</div>`; onOpen?.(); }
        function closeModal() { document.getElementById('modal-root').innerHTML = ''; }
        function exportData() {
          const file = new Blob([JSON.stringify({ exportedAt: now(), archive: data }, null, 2)], { type: 'application/json' });
          const link = document.createElement('a'); link.href = URL.createObjectURL(file); link.download = 'ren-protocol-archive.json'; link.click(); URL.revokeObjectURL(link.href); toast('Local archive exported as JSON.');
        }
        function importData() {
          const input = document.createElement('input'); input.type = 'file'; input.accept = 'application/json'; input.onchange = () => { const file = input.files?.[0]; if (!file) return; const reader = new FileReader(); reader.onload = () => { try { const parsed = JSON.parse(reader.result); if (!parsed.archive?.masterbook || !Array.isArray(parsed.archive?.chapters)) throw new Error(); data = { ...blankState(), ...parsed.archive }; data.draft = currentChapter().versions[data.selectedVersion || 'main'] || ''; persist('Archive imported locally.'); render(); } catch { toast('That file is not a valid Ren Protocol archive.'); } }; reader.readAsText(file); }; input.click();
        }

        document.addEventListener('click', event => {
          const target = event.target.closest('[data-action]');
          if (!target) return;
          const { action, category, id, view, version, fingerprint, message } = target.dataset;
          if (action === 'close-modal-backdrop' && event.target === target) closeModal();
          else if (action === 'close-modal') closeModal();
          else if (action === 'set-view') { saveDraft(false); data.activeView = view; data.draft = currentChapter().versions[data.selectedVersion] || ''; persist('', true); render(); }
          else if (action === 'toggle-inspector') document.getElementById('app').classList.toggle('inspector-open');
          else if (action === 'new-chapter') { saveDraft(false); const chapter = newChapter(data.chapters.length + 1); data.chapters.push(chapter); data.activeChapterId = chapter.id; data.selectedVersion = 'main'; data.draft = ''; logEvent('Chapter created', chapter.title, 'A new chapter was opened in the Chapter Stream.', chapter.id); persist('New chapter created locally.'); render(); setTimeout(() => document.getElementById('chapter-title')?.focus(), 20); }
          else if (action === 'select-chapter') { saveDraft(false); data.activeChapterId = id; const chapter = currentChapter(); data.selectedVersion = chapter.activeVersion || 'main'; data.draft = chapter.versions[data.selectedVersion] || ''; persist('', true); render(); }
          else if (action === 'switch-version') { saveDraft(false); const chapter = currentChapter(); chapter.activeVersion = version; data.selectedVersion = version; data.draft = chapter.versions[version] || ''; persist('', true); render(); }
          else if (action === 'save-draft') saveDraft(true);
          else if (action === 'toggle-section') { data.collapsed = data.collapsed.includes(category) ? data.collapsed.filter(item => item !== category) : [...data.collapsed, category]; persist('', true); render(); }
          else if (action === 'open-entry-form') openEntryForm(category, id);
          else if (action === 'save-entry-form') saveEntryForm(category, id || null);
          else if (action === 'view-entry' || action === 'view-history') viewEntry(category, id);
          else if (action === 'edit-from-profile') { closeModal(); openEntryForm(category, id); }
          else if (action === 'delete-entry') { const entry = data.masterbook[category].find(item => item.id === id); if (entry && window.confirm(`Delete “${entry.name}” from the Masterbook? This cannot be undone unless you restore an exported archive.`)) { data.masterbook[category] = data.masterbook[category].filter(item => item.id !== id); logEvent('Masterbook deleted', `${entry.name} removed`, `${categories[category].singular} record deleted from the Masterbook.`); persist(`${entry.name} deleted.`); render(); } }
          else if (action === 'run-check') { const flags = continuityFlags(); toast(flags.length ? `${flags.length} continuity item${flags.length > 1 ? 's' : ''} flagged for review.` : 'Continuity check complete: no active conflicts found.'); document.getElementById('app').classList.add('inspector-open'); }
          else if (action === 'mark-intentional') { if (!data.intentional.some(item => item.fingerprint === fingerprint)) { data.intentional.unshift({ fingerprint, message, at: now() }); logEvent('Continuity intention', 'Exception marked intentional', message); persist('Intent bubble recorded. This rule will remain quiet.'); render(); } }
          else if (action === 'remove-intentional') { data.intentional = data.intentional.filter(item => item.fingerprint !== fingerprint); persist('Intent bubble removed. The checker will watch this line again.'); render(); }
          else if (action === 'export-data') exportData();
          else if (action === 'import-data') importData();
        });
        document.addEventListener('keydown', event => { if (event.key === 'Escape') { closeModal(); document.getElementById('app').classList.remove('inspector-open'); } if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') { event.preventDefault(); saveDraft(true); } });
        setInterval(autosave, 30000);
        render();
      })();
    </script>
  </body>
</html>
