      /*

      :root {

      .quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .quick-action { min-height: 74px; display: grid; grid-template-columns: 22px minmax(0,1fr); align-items: center; gap: 9px; padding: 11px; border: 1px solid rgba(237,232,218,.09); border-radius: 3px; background: rgba(255,255,255,.018); color: #d8d3c7; text-align: left; }
      .quick-action:hover { border-color: var(--line-gold); background: var(--gold-dim); }
      .quick-action svg { width: 17px; color: var(--gold); }
      .quick-action strong { display: block; font-size: 11px; }
      .quick-action small { display: block; margin-top: 3px; color: #87858c; font-size: 9px; line-height: 1.3; }
      .activity-list { display: grid; }
      .activity-row { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
      .activity-row time { color: var(--gold); font: 9px/1.3 var(--mono); }
      .activity-row strong { display: block; color: #ded9ce; font: 600 12px/1.15 var(--serif); }
      .activity-row span { display: block; margin-top: 4px; color: #98969a; font-size: 10px; line-height: 1.4; }
      .project-slip { position: relative; padding: 17px; border: 1px solid rgba(237,232,218,.17); border-left: 2px solid rgba(201,168,76,.58); border-radius: 3px 12px 3px 3px; background: linear-gradient(155deg, rgba(237,232,218,.05), rgba(13,14,20,.25) 70%); }
      .project-slip h2 { margin: 8px 0 0; color: #f4eee0; font: 500 25px/1 var(--serif); }
      .project-slip p { margin: 9px 0 0; color: #afa99a; font: 11px/1.55 var(--sans); }

      .planner-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
      .planner-layout { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 18px; }
      .scene-board { display: grid; grid-template-columns: repeat(4, minmax(190px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 8px; }
      .scene-lane { min-height: 340px; padding: 10px; border: 1px solid var(--line); border-radius: 4px 10px 4px 4px; background: rgba(9,10,15,.36); }
      .scene-lane h3 { display: flex; justify-content: space-between; align-items: center; margin: 0 0 11px; color: #d8d4ca; font: 600 13px/1 var(--serif); }
      .scene-lane h3 span { color: var(--gold); font: 9px/1 var(--mono); }
      .scene-stack { display: grid; gap: 8px; }
      .scene-card { width: 100%; padding: 11px; border: 1px solid rgba(237,232,218,.09); border-left: 2px solid rgba(201,168,76,.55); border-radius: 3px 9px 3px 3px; background: rgba(24,26,35,.93); color: inherit; text-align: left; }
      .scene-card:hover { border-color: rgba(201,168,76,.5); background: rgba(201,168,76,.08); }
      .scene-card small { display: block; color: var(--gold); font: 8px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase; }
      .scene-card strong { display: block; margin-top: 7px; color: #ece7dc; font: 600 14px/1.15 var(--serif); }
      .scene-card p { display: -webkit-box; overflow: hidden; margin: 7px 0 0; color: #97969b; font-size: 10px; line-height: 1.4; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .lane-empty { padding: 17px 7px; color: #72737a; font: italic 11px/1.45 var(--serif); text-align: center; }
      .issue-list { display: grid; gap: 8px; }
      .issue-row { padding: 11px; border: 1px solid rgba(237,232,218,.08); border-radius: 3px; background: rgba(255,255,255,.02); }
      .issue-row.resolved { opacity: .5; }
      .issue-row small { color: var(--gold); font: 8px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase; }
      .issue-row strong { display: block; margin-top: 6px; color: #e4dfd4; font: 600 13px/1.15 var(--serif); }
      .issue-row p { margin: 6px 0 9px; color: #96959a; font-size: 10px; line-height: 1.45; }
      .issue-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

      .notes-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
      .notes-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; }
      .note-card { min-height: 180px; padding: 15px; text-align: left; color: inherit; }
      .note-card:hover { border-color: var(--line-gold); transform: translateY(-1px); }
      .note-card small { color: var(--gold); font: 8px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
      .note-card h2 { margin: 10px 0 0; color: #ece6d9; font: 600 19px/1.06 var(--serif); }
      .note-card p { display: -webkit-box; overflow: hidden; margin: 9px 0 0; color: #a4a29f; font-size: 11px; line-height: 1.5; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
      .note-card footer { margin-top: 12px; color: #7d7d84; font: 8px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase; }

      .inbox-layout { display: grid; grid-template-columns: minmax(0, 1.14fr) minmax(290px, .86fr); gap: 18px; align-items: start; }
      .inbox-paper { padding: 22px; border: 1px solid rgba(237,232,218,.35); border-radius: 4px 16px 4px 4px; background: linear-gradient(135deg, rgba(245,238,219,.98), rgba(229,222,204,.96)); color: #2d2a22; box-shadow: 0 22px 55px rgba(0,0,0,.22); }
      .inbox-paper .eyebrow { color: #746242; }
      .inbox-paper h2 { margin: 8px 0 0; font: 500 30px/1 var(--serif); }
      .inbox-paper p { margin: 10px 0 0; color: #696154; font-size: 12px; line-height: 1.55; }
      .inbox-paper textarea { width: 100%; min-height: 365px; margin-top: 18px; border: 1px solid rgba(57,48,32,.2); padding: 15px; resize: vertical; outline: 0; background: rgba(255,255,255,.4); color: #302d25; font: 16px/1.65 var(--serif); }
      .inbox-paper textarea:focus { border-color: rgba(161,127,47,.65); box-shadow: 0 0 0 3px rgba(201,168,76,.13); }
      .inbox-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; }
      .privacy-slip { padding: 15px; border: 1px solid rgba(201,168,76,.35); border-left: 2px solid var(--gold); border-radius: 3px 10px 3px 3px; background: linear-gradient(145deg, rgba(201,168,76,.12), rgba(20,22,29,.68)); }
      .privacy-slip h3 { margin: 0; color: #f0e5c4; font: 600 15px/1 var(--serif); }
      .privacy-slip p { margin: 8px 0 0; color: #b8b0a1; font-size: 11px; line-height: 1.5; }
      .suggestion-panel { overflow: hidden; border: 1px solid var(--line); border-radius: 4px 14px 4px 4px; background: rgba(16,18,26,.85); }
      .suggestion-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px; border-bottom: 1px solid var(--line); }
      .suggestion-head h2 { margin: 6px 0 0; color: #eee8dc; font: 600 22px/1 var(--serif); }
      .suggestion-summary { margin: 0; padding: 13px 16px; color: #aaa7a1; font: 11px/1.5 var(--sans); border-bottom: 1px solid var(--line); }
      .suggestion-list { display: grid; gap: 8px; max-height: 480px; overflow: auto; padding: 10px; }
      .suggestion-card { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; padding: 11px; border: 1px solid rgba(237,232,218,.09); border-radius: 3px 9px 3px 3px; background: rgba(255,255,255,.025); }
      .suggestion-card input { accent-color: var(--gold); margin-top: 3px; }
      .suggestion-card small { color: var(--gold); font: 8px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
      .suggestion-card strong { display: block; margin-top: 6px; color: #e9e4d9; font: 600 15px/1.12 var(--serif); }
      .suggestion-card p { margin: 6px 0 0; color: #96959b; font-size: 10px; line-height: 1.45; }
      .tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
      .tag-chip { display: inline-flex; align-items: center; border: 1px solid rgba(201,168,76,.32); border-radius: 999px; padding: 3px 6px; color: #d9bf7c; background: rgba(201,168,76,.07); font: 8px/1 var(--mono); letter-spacing: .04em; }
      .suggestion-footer { display: flex; gap: 8px; justify-content: flex-end; padding: 13px 16px; border-top: 1px solid var(--line); }

      .composer-layout { display: grid; grid-template-columns: minmax(0, .94fr) minmax(320px, 1.06fr); gap: 18px; align-items: start; }
      .composer-brief { padding: 21px; border: 1px solid rgba(237,232,218,.36); border-radius: 4px 15px 4px 4px; background: linear-gradient(135deg, rgba(245,238,219,.98), rgba(229,222,204,.96)); color: #302c23; box-shadow: 0 22px 55px rgba(0,0,0,.2); }
      .composer-brief h2 { margin: 7px 0 0; font: 500 29px/1 var(--serif); }
      .composer-brief > p { margin: 8px 0 16px; color: #676154; font-size: 12px; line-height: 1.52; }
      .composer-brief label { display: block; margin: 13px 0 6px; color: #6a5d43; font: 9px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
      .composer-brief textarea, .composer-brief input, .composer-brief select { box-sizing: border-box; width: 100%; border: 1px solid rgba(57,48,32,.2); padding: 10px 11px; outline: 0; background: rgba(255,255,255,.42); color: #302d25; font: 12px/1.5 var(--sans); }
      .composer-brief textarea { min-height: 92px; resize: vertical; }
      .composer-brief textarea:focus, .composer-brief input:focus, .composer-brief select:focus { border-color: rgba(161,127,47,.75); box-shadow: 0 0 0 3px rgba(201,168,76,.13); }
      .composer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .composer-disclosure { margin-top: 16px; color: #6d675b; font-size: 10px; line-height: 1.45; }
      .composer-output { overflow: hidden; border: 1px solid var(--line); border-radius: 4px 15px 4px 4px; background: rgba(16,18,26,.86); }
      .composer-output-head { padding: 17px; border-bottom: 1px solid var(--line); }
      .composer-output-head h2 { margin: 7px 0 0; color: #efe9dd; font: 500 25px/1 var(--serif); }
      .composer-output-head p { margin: 8px 0 0; color: #a7a39c; font-size: 11px; line-height: 1.45; }
      .composer-output textarea { box-sizing: border-box; width: calc(100% - 28px); min-height: 480px; margin: 14px; border: 1px solid rgba(237,232,218,.13); padding: 17px; resize: vertical; outline: 0; background: #e8dfca; color: #29251d; font: 16px/1.7 var(--serif); }
      .composer-output textarea:focus { border-color: rgba(201,168,76,.82); }
      .composer-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 13px 15px; border-top: 1px solid var(--line); }
      .composer-empty { min-height: 510px; display: grid; place-items: center; padding: 30px; text-align: center; color: #8f8d91; }
      .composer-empty strong { display: block; margin-bottom: 7px; color: #dad4c8; font: 500 25px/1 var(--serif); }

      .palette-results { display: grid; gap: 6px; margin-top: 14px; }
      .palette-result { width: 100%; padding: 10px 11px; border: 1px solid transparent; border-left-color: var(--line-gold); background: rgba(255,255,255,.02); color: inherit; text-align: left; }
      .palette-result:hover { border-color: rgba(201,168,76,.42); background: var(--gold-dim); }
      .palette-result small { display: block; color: var(--gold); font: 8px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
      .palette-result strong { display: block; margin-top: 5px; color: #e9e3d8; font: 600 13px/1.1 var(--serif); }

      .app.focus-mode .rail { display: none; }
      .app.focus-mode .shell { grid-template-columns: minmax(0, 1fr); }
      .app.focus-mode .inspector { display: none; }
      .app.focus-mode .workspace { max-width: 1180px; width: 100%; margin: 0 auto; }

      .inspector { position: relative; min-height: 100vh; border-left: 1px solid var(--line); background: linear-gradient(180deg, rgba(22,24,31,.74), rgba(9,10,15,.62)); backdrop-filter: blur(18px); padding: 21px 16px; }
      .inspector::before { content: "FOLIO · CONTINUITY"; position: absolute; top: 94px; right: 5px; color: rgba(201,168,76,.24); font: 8px/1 var(--mono); letter-spacing: .16em; writing-mode: vertical-rl; pointer-events: none; }
      .inspector-head { display: flex; align-items: center; justify-content: space-between; padding: 0 3px 15px; border-bottom: 1px solid var(--line); }
      .inspector-head h2 { margin: 0; color: var(--paper); font: 600 15px/1 var(--serif); }
      .inspector-head span { color: var(--gold); font: 9px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
      .continuity-score { display: flex; align-items: center; gap: 14px; margin-top: 12px; padding: 14px 12px; border: 1px solid rgba(237,232,218,.08); border-left: 2px solid rgba(201,168,76,.58); background: repeating-linear-gradient(0deg, rgba(201,168,76,.025) 0 1px, transparent 1px 22px); }
      .score-ring { position: relative; display: grid; place-items: center; width: 47px; height: 47px; border: 2px solid var(--gold); border-radius: 50%; color: var(--gold-bright); font: 10px/1 var(--mono); }
      .score-ring::after { content: ""; position: absolute; inset: 4px; border: 1px solid rgba(201,168,76,.35); border-radius: 50%; }
      .score-copy { min-width: 0; }
      .score-copy strong { display: block; color: #e9e4d8; font-size: 11px; }
      .score-copy span { display: block; margin-top: 4px; color: #929095; font-size: 10px; line-height: 1.4; }
      .check-button { width: 100%; margin: 13px 0 15px; }
      .flag-list { display: grid; gap: 8px; }
      .flag { padding: 11px; border: 1px solid rgba(216,121,108,.27); border-radius: 3px 10px 3px 3px; background: rgba(216,121,108,.075); }
      .flag.intentional { border-color: rgba(127,174,136,.28); background: rgba(127,174,136,.07); }
      .flag-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
      .flag-kind { color: #e9998e; font: 9px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
      .flag.intentional .flag-kind { color: #9acaa4; }
      .flag p { margin: 7px 0 10px; color: #c5c1ba; font-size: 10px; line-height: 1.48; }
      .flag .intent { padding: 0; min-height: auto; border: 0; background: transparent; color: var(--gold-bright); font: 600 9px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; }
      .flag .intent:hover { text-decoration: underline; }
      .clear-state { padding: 17px 3px; color: #a8bda8; font: 15px/1.45 var(--serif); }
      .clear-state small { display: block; margin-top: 6px; color: #8c908a; font: 10px/1.45 var(--sans); }
      .inspector-section { margin-top: 23px; }
      .inspector-section h3 { margin: 0 0 9px; color: var(--paper-muted); font: 9px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
      .intent-list { display: grid; gap: 5px; }
      .intent-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 7px; padding: 8px 0; border-bottom: 1px solid var(--line); color: #a6aaa3; font-size: 10px; line-height: 1.35; }
      .intent-row button { flex: 0 0 auto; border: 0; background: none; color: #888; font-size: 14px; line-height: 1; }
      .intent-row button:hover { color: var(--danger); }

      .modal-backdrop { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; padding: 18px; background: rgba(4,5,9,.71); backdrop-filter: blur(8px); animation: fade .18s var(--ease); }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      .modal { width: min(650px,100%); max-height: min(760px, calc(100vh - 36px)); overflow: auto; border: 1px solid rgba(201,168,76,.38); border-radius: 5px 16px 5px 5px; background: #171a24; box-shadow: 0 28px 110px rgba(0,0,0,.55); animation: modalin .22s var(--ease); }
      @keyframes modalin { from { opacity: 0; transform: translateY(9px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 21px 22px 17px; border-bottom: 1px solid var(--line); }
      .modal-head h2 { margin: 6px 0 0; color: #f1ecdf; font: 500 27px/1 var(--serif); }
      .modal-close { display: grid; place-items: center; width: 29px; height: 29px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: #a8a7aa; }
      .modal-close:hover { color: var(--paper); background: rgba(255,255,255,.06); }
      .modal-body { padding: 20px 22px; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .field { display: grid; gap: 7px; }
      .field.full { grid-column: 1 / -1; }
      .field label { color: #aaa7a0; font: 9px/1 var(--mono); letter-spacing: .11em; text-transform: uppercase; }
      .field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line); border-radius: 3px; padding: 9px 10px; background: #0d0f16; color: #ece7da; font-size: 12px; }
      .field textarea { min-height: 92px; resize: vertical; line-height: 1.5; }
      .field .hint { color: #777880; font-size: 9px; line-height: 1.45; }
      .modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 15px 22px 20px; border-top: 1px solid var(--line); }
      .profile-grid { display: grid; gap: 18px; }
      .profile-dek { margin: 0; color: #b9b5ac; font: 14px/1.55 var(--serif); }
      .data-list { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px 16px; }
      .data-pair { border-top: 1px solid var(--line); padding-top: 8px; }
      .data-pair small { display: block; color: #8c8b91; font: 8px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
      .data-pair span { display: block; margin-top: 5px; color: #e2ddd2; font-size: 11px; line-height: 1.4; }
      .history-list { display: grid; gap: 0; border-top: 1px solid var(--line); }
      .history-item { padding: 9px 0; border-bottom: 1px solid var(--line); }
      .history-item time { display: block; color: var(--gold); font: 9px/1 var(--mono); }
      .history-item p { margin: 5px 0 0; color: #b7b5b0; font-size: 10px; }
      .toast { position: fixed; z-index: 40; right: 20px; bottom: 20px; max-width: min(360px,calc(100vw - 40px)); padding: 12px 14px; border: 1px solid var(--line-gold); border-radius: 4px 10px 4px 4px; background: #1b1d25; box-shadow: 0 14px 40px rgba(0,0,0,.35); color: #eee8db; font-size: 11px; opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .2s var(--ease), transform .2s var(--ease); }
      .toast.show { opacity: 1; transform: translateY(0); }

      @media (max-width: 1130px) {
        .shell { grid-template-columns: 215px minmax(0,1fr); }
        .inspector { position: fixed; z-index: 8; right: 0; top: 0; width: min(340px, 90vw); min-height: 100vh; transform: translateX(102%); transition: transform .24s var(--ease); box-shadow: -20px 0 60px rgba(0,0,0,.3); }
        .app.inspector-open .inspector { transform: translateX(0); }
        .inspector-toggle { display: inline-flex; }
      }
      @media (min-width: 1131px) { .inspector-toggle { display: none; } }
      @media (max-width: 760px) {
        body { font-size: 13px; }
        .app { overflow: visible; }
        .shell { display: block; }
        .rail { min-height: auto; padding: 13px 13px 10px; border-right: 0; border-bottom: 1px solid var(--line); gap: 10px; }
        .rail::after, .protocol-label, .rail-bottom, .rail-footer { display: none; }
        .brand { padding-left: 3px; }
        .nav { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; overflow: auto; padding-bottom: 2px; }
        .nav-button { min-height: 39px; justify-content: center; padding: 0 7px; }
        .nav-copy small { display: none; }
        .nav-copy strong { font-size: 10px; white-space: nowrap; }
        .workspace { padding: 0 14px 28px; }
        .topbar { height: 58px; }
        .breadcrumb .kicker, .breadcrumb .slash { display: none; }
        .status { display: none; }
        .top-actions .button:not(.inspector-toggle) { display: none; }
        .view-head { display: block; margin-bottom: 17px; }
        .view-head h1 { font-size: 35px; }
        .chapter-layout, .masterbook-layout, .dashboard-grid, .planner-layout, .inbox-layout, .composer-layout { display: block; }
        .dashboard-side, .planner-layout > aside { margin-top: 15px; }
        .metric-row { grid-template-columns: 1fr 1fr; }
        .scene-board { grid-template-columns: repeat(4, 205px); }
        .notes-grid { grid-template-columns: 1fr; }
        .inbox-layout > aside { margin-top: 15px; }
        .composer-layout > .composer-output { margin-top: 15px; }
        .chapter-index { position: static; margin-bottom: 11px; }
        .chapter-list { display: flex; gap: 5px; max-height: none; overflow: auto; }
        .chapter-row { flex: 0 0 130px; }
        .manuscript-body { background-image: none; }
        .editor { min-height: 45vh; font-size: 17px; }
        .draft-tabs { overflow: auto; max-width: 75%; }
        .draft-tab { padding: 0 6px; white-space: nowrap; }
        .word-count { display: none; }
        .book-actions { margin-top: 15px; }
        .world-card { display: none; }
        .form-grid { grid-template-columns: 1fr; }
        .field.full { grid-column: auto; }
        .data-list { grid-template-columns: 1fr; }
      }
      /* Bright studio redesign — deliberately calm, friendly, and easy to scan. */
      :root { --ink: #f6f5f0; --ink-2: #ffffff; --ink-3: #edf1f7; --surface: #ffffff; --surface-solid: #ffffff; --paper: #243044; --paper-muted: #64748b; --gold: #6d5ce8; --gold-bright: #5646d8; --gold-dim: #eeecff; --line: #e4e7ee; --line-gold: #c9c3ff; --danger: #d95757; --success: #20a378; --serif: ui-rounded, "Avenir Next", "Nunito", system-ui, sans-serif; --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --mono: ui-sans-serif, system-ui, sans-serif; }
      html, body { background: #f6f5f0; color: #243044; }

          else if (action === 'set-view') { closeModal(); saveDraft(false); navigateTo(view); }
          else if (action === 'open-palette') openPalette();
          else if (action === 'open-settings') openSettings();
          else if (action === 'open-export') openExport();
          else if (action === 'export-feature-tour-pdf') exportFeatureTourPdf();
          else if (action === 'open-final-pdf-export') openFinalPdfExport();
          else if (action === 'generate-final-pdf') exportFinalNovelPdf();
          else if (action === 'organize-dump') organizeBrainDump();
          else if (action === 'save-dump-text') saveDumpText();
          else if (action === 'save-dump-link') saveDumpLink();
          else if (action === 'delete-dump-item') deleteDumpItem(id);
          else if (action === 'file-dump-note') fileDumpItemAsNote(id);
          else if (action === 'open-dump-organizer') openDumpOrganizationPreview();
          else if (action === 'set-dump-filter') { dumpBook().filter = target.dataset.dumpFilter || 'all'; persist('', true); render(); }
          else if (action === 'set-dump-tag') { dumpBook().activeTag = target.dataset.tag || ''; persist('', true); render(); }
          else if (action === 'studio-set-tag') { dumpBook().activeTag = target.dataset.tag || ''; persist('', true); render(); }
          else if (action === 'edit-dump-tags') openDumpTagEditor(id);
          else if (action === 'clear-dump-discovery') { const box = dumpBook(); box.searchQuery = ''; box.filter = 'all'; box.activeTag = ''; persist('', true); render(); }
          else if (action === 'generate-section') generateSection();
          else if (action === 'discard-generated') { composer().generated = ''; composer().sectionTitle = ''; composer().craftNote = ''; persist('Unmerged guided draft discarded.'); render(); }
          else if (action === 'copy-generated') { navigator.clipboard?.writeText(reviewedGeneratedText()); toast('Reviewed section copied to your clipboard.'); }
          else if (action === 'replace-with-generated') mergeGenerated('replace');
          else if (action === 'append-generated') mergeGenerated('append');
          else if (action === 'insert-generated') mergeGenerated('insert');
          else if (action === 'open-outline-templates') openOutlineTemplates();
          else if (action === 'apply-outline-template') applyOutlineTemplate(target.dataset.template);
          else if (action === 'open-version-compare') openVersionCompare();
          else if (action === 'issue-from-comparison') issueFromComparison();
          else if (action === 'open-rewrite') openRewrite();
          else if (action === 'copy-rewrite') { navigator.clipboard?.writeText(document.getElementById('rewrite-result')?.value || revisionState().rewrite?.result || ''); toast('Rewrite proposal copied to your clipboard.'); }
          else if (action === 'discard-rewrite') { revisionState().rewrite = null; persist('Rewrite proposal discarded.'); closeModal(); toast('Rewrite proposal discarded.'); }
          else if (action === 'replace-selection-with-rewrite') replaceSelectionWithRewrite();
          else if (action === 'open-consistency') openConsistency();
          else if (action === 'request-consistency') requestConsistency();
          else if (action === 'discard-consistency') { revisionState().consistency = null; persist('Consistency summary discarded.'); closeModal(); toast('Consistency summary discarded.'); }
          else if (action === 'open-critic') openCritic();
          else if (action === 'request-critic') requestCritic();
          else if (action === 'view-critic-report') showCriticReport(id);
          else if (action === 'file-critic-plan') fileCriticPlan(id);
          else if (action === 'delete-critic-report') deleteCriticReport(id);
          else if (action === 'open-dialogue-lab') openDialogueLab();
          else if (action === 'copy-dialogue-option') { const option = document.getElementById(`dialogue-option-${target.dataset.index}`)?.value || revisionState().dialogueLab?.variants?.[Number(target.dataset.index)]?.text || ''; navigator.clipboard?.writeText(option); toast('Dialogue option copied to your clipboard.'); }
          else if (action === 'discard-dialogue-lab') { revisionState().dialogueLab = null; persist('Dialogue options discarded locally.'); closeModal(); toast('Dialogue options discarded.'); }
          else if (action === 'open-lore-workshop') openLoreWorkshop();
          else if (action === 'file-lore-idea') fileLoreIdea(target.dataset.index);
          else if (action === 'discard-lore-workshop') { revisionState().loreWorkshop = null; persist('Lore proposals discarded locally.'); closeModal(); toast('Lore proposals discarded.'); }
          else if (action === 'open-style-guide') openStyleGuide();
          else if (action === 'open-creature-rules') openCreatureRules();
          else if (action === 'copy-creature-option') { navigator.clipboard?.writeText(target.dataset.option || ''); toast('Creature alternative copied.'); }
          else if (action === 'open-cowriter') openCoWriter(target.dataset.mode || 'next_line');
          else if (action === 'copy-cowriter') { navigator.clipboard?.writeText(reviewedCoWriterText()); toast('Co-writing suggestion copied.'); }
          else if (action === 'copy-cowriter-choice') { const choice = revisionState().coWriter?.choices?.[Number(target.dataset.index)]; navigator.clipboard?.writeText(choice?.continuation || ''); toast('Scene choice copied.'); }
          else if (action === 'append-cowriter') appendCoWriter();
          else if (action === 'discard-cowriter') { revisionState().coWriter = null; persist('Co-writing proposal discarded locally.'); closeModal(); toast('Co-writing proposal discarded.'); }
          else if (action === 'file-suggestions') fileBrainDumpSuggestions();
          else if (action === 'clear-inbox-suggestions') { inbox().suggestions = []; inbox().summary = ''; persist('Brain Dump proposals discarded.'); render(); }
          else if (action === 'select-all-suggestions') { document.querySelectorAll('[data-suggestion-index]').forEach(check => { check.checked = true; }); }
          else if (action === 'toggle-inspector') document.getElementById('app').classList.toggle('inspector-open');
          else if (action === 'toggle-focus') document.getElementById('app').classList.toggle('focus-mode');
          else if (action === 'open-sprint') openSprint();
          else if (action === 'start-sprint') startSprint();
          else if (action === 'finish-sprint') finishSprint();
          else if (action === 'open-annotation-form') openAnnotationForm();
          else if (action === 'open-revision-checklist') openRevisionChecklist();
          else if (action === 'toggle-check-item') { const chapter = currentChapter(); const item = checklistFor(chapter.id).find(entry => entry.id === id); if (item) { item.done = Boolean(target.checked); item.completedAt = item.done ? now() : null; persist(item.done ? 'Review step marked complete.' : 'Review step reopened.', true); openRevisionChecklist(); } }
          else if (action === 'toggle-bookmark') { const chapter = currentChapter(); data.bookmarks = data.bookmarks.includes(chapter.id) ? data.bookmarks.filter(item => item !== chapter.id) : [...data.bookmarks, chapter.id]; persist(data.bookmarks.includes(chapter.id) ? 'Folio bookmarked.' : 'Folio bookmark removed.'); render(); }
          else if (action === 'chapter-details') openChapterDetails();
          else if (action === 'new-chapter') { saveDraft(false); const chapter = newChapter(data.chapters.length + 1); data.chapters.push(chapter); data.activeChapterId = chapter.id; data.selectedVersion = 'main'; data.draft = ''; logEvent('Chapter created', chapter.title, 'A new chapter was opened in the Chapter Stream.', chapter.id); navigateTo('chapter'); setTimeout(() => document.getElementById('chapter-title')?.focus(), 20); }
          else if (action === 'open-arc-form') openArcForm(id || null, act || '');
          else if (action === 'open-relationship-form') openRelationshipForm(id || null);
          else if (action === 'select-chapter') { closeModal(); saveDraft(false); data.activeChapterId = id; const chapter = currentChapter(); data.selectedVersion = chapter.activeVersion || 'main'; data.draft = chapter.versions[data.selectedVersion] || ''; navigateTo('chapter'); }
          else if (action === 'switch-version') { saveDraft(false); const chapter = currentChapter(); chapter.activeVersion = version; data.selectedVersion = version; data.draft = chapter.versions[version] || ''; persist('', true); render(); }
          else if (action === 'save-draft') saveDraft(true);
          else if (action === 'open-scene-form') openSceneForm(id || null);
          else if (action === 'move-scene') moveScene(id, target.dataset.direction || 'up');
          else if (action === 'open-story-event-form') openStoryEventForm(id || null);
          else if (action === 'open-note-form') openNoteForm(id || null, target.dataset.kind || '');
          else if (action === 'open-issue-form') openIssueForm();
          else if (action === 'resolve-issue') { const issue = data.issues.find(item => item.id === id); if (issue) { issue.resolved = true; issue.resolvedAt = now(); logEvent('Revision issue resolved', issue.title, 'Issue closed in the revision ledger.', issue.chapterId); persist('Revision issue marked resolved.'); render(); } }
          else if (action === 'toggle-section') { data.collapsed = data.collapsed.includes(category) ? data.collapsed.filter(item => item !== category) : [...data.collapsed, category]; persist('', true); render(); }
          else if (action === 'open-entry-form') openEntryForm(category, id);
          else if (action === 'save-entry-form') saveEntryForm(category, id || null);
          else if (action === 'view-entry' || action === 'view-history') viewEntry(category, id);
          else if (action === 'edit-from-profile') { closeModal(); openEntryForm(category, id); }
          else if (action === 'delete-entry') { const entry = data.masterbook[category].find(item => item.id === id); if (entry && window.confirm(`Delete “${entry.name}” from the Masterbook? This cannot be undone unless you restore an exported archive.`)) { data.masterbook[category] = data.masterbook[category].filter(item => item.id !== id); logEvent('Masterbook deleted', `${entry.name} removed`, `${categories[category].singular} record deleted from the Masterbook.`); persist(`${entry.name} deleted.`); render(); } }
          else if (action === 'run-check') { const flags = continuityFlags(); toast(flags.length ? `${flags.length} continuity item${flags.length > 1 ? 's' : ''} flagged for review.` : 'Continuity check complete: no active conflicts found.'); document.getElementById('app').classList.add('inspector-open'); }
          else if (action === 'issue-from-flag') { const issue = { id: uid(), title: 'Continuity review needed', type: 'Continuity', priority: 'High', note: message, chapterId: currentChapter().id, createdAt: now(), resolved: false }; data.issues.unshift(issue); logEvent('Continuity issue filed', issue.title, issue.note, issue.chapterId); persist('Continuity flag added to the revision ledger.'); render(); }
          else if (action === 'mark-intentional') { if (!data.intentional.some(item => item.fingerprint === fingerprint)) { data.intentional.unshift({ fingerprint, message, at: now() }); logEvent('Continuity intention', 'Exception marked intentional', message); persist('Intent bubble recorded. This rule will remain quiet.'); render(); } }
          else if (action === 'remove-intentional') { data.intentional = data.intentional.filter(item => item.fingerprint !== fingerprint); persist('Intent bubble removed. The checker will watch this line again.'); render(); }
          else if (action === 'export-data') { exportData(); closeModal(); }
          else if (action === 'email-ready-backup') { prepareEmailBackup(); closeModal(); }
          else if (action === 'export-current-text') { exportCurrentText(); closeModal(); }
          else if (action === 'export-manuscript-text') { exportManuscriptText(); closeModal(); }
          else if (action === 'export-markdown') { exportMarkdown(); closeModal(); }
          else if (action === 'export-manuscript-package') { exportManuscriptPackage(); closeModal(); }
          else if (action === 'import-data') { closeModal(); importData(); }
          else if (action === 'import-markdown') { closeModal(); importMarkdown(); }
          else if (action === 'reset-archive') { if (window.confirm('Reset this browser archive? Export a JSON backup first if you want to preserve anything.')) { data = blankState(); localStorage.removeItem(STORAGE_KEY); closeModal(); toast('The local archive was reset.'); render(); } }
        });
        document.addEventListener('keydown', event => { if (event.key === 'Escape') { closeModal(); document.getElementById('app').classList.remove('inspector-open'); } if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') { event.preventDefault(); saveDraft(true); } });
        setInterval(autosave, 30000);
        setInterval(() => { if (data.focusSession) updateSprintUi(); }, 1000);
        render();
      })();
    </script>
  </body>
</html>
